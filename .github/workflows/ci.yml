name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # ------------------------------------------------------------------------
    # Which of the four analyses can this diff have broken?
    #
    # The filters below name the areas a file belongs to. They do not encode
    # the cascade — `scope/` reads what `parse/` produced, and `flow/` and
    # `types/` read what both produced, so a `parse/` change runs them all — because
    # that is a fact about the source layout rather than about CI, and it lives
    # in `packages/jskit/scripts/test-affected.mjs`. This job hands that script
    # the areas the diff touched and lets it expand them.
    #
    # `predicate-quantifier: some-with-excludes` is what makes `all` work: a
    # file matches it when some pattern includes it and no pattern excludes it.
    # `all` therefore reads as "everything that is not already accounted for",
    # so a file in a directory nobody has thought of yet — a new subdirectory
    # of `src/`, a new config at the root — runs the whole suite rather than
    # silently running nothing.
    # ------------------------------------------------------------------------
    changes:
        name: Detect Affected Areas
        runs-on: ubuntu-latest
        outputs:
            areas: ${{ join(fromJSON(steps.tests.outputs.changes), ' ') }}
            inspect: ${{ steps.apps.outputs.inspect }}
            native: ${{ steps.native.outputs.native }}
        steps:
            - uses: actions/checkout@v7

            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: tests
              with:
                  predicate-quantifier: some-with-excludes
                  filters: |
                      parse:
                        - 'packages/jskit/src/parse/**'
                        - 'packages/jskit/tests/parse/**'
                        - '!**/*.md'
                      scope:
                        - 'packages/jskit/src/scope/**'
                        - 'packages/jskit/tests/scope/**'
                        - '!**/*.md'
                      flow:
                        - 'packages/jskit/src/flow/**'
                        - 'packages/jskit/tests/flow/**'
                        - '!**/*.md'
                      types:
                        - 'packages/jskit/src/types/**'
                        - 'packages/jskit/tests/types/**'
                        - '!**/*.md'
                      all:
                        - '**'
                        - '!**/*.md'
                        - '!docs/**'
                        - '!packages/*/docs/**'
                        - '!.agents/**'
                        - '!.claude/**'
                        - '!.github/ISSUE_TEMPLATE/**'
                        - '!packages/jskit/src/parse/**'
                        - '!packages/jskit/tests/parse/**'
                        - '!packages/jskit/src/scope/**'
                        - '!packages/jskit/tests/scope/**'
                        - '!packages/jskit/src/flow/**'
                        - '!packages/jskit/tests/flow/**'
                        - '!packages/jskit/src/types/**'
                        - '!packages/jskit/tests/types/**'
                        - '!packages/jskit-inspect/**'
                        - '!packages/jskit-native/**'

            # A separate step for the same reason `inspect` has one below:
            # `changes` is passed to `test-affected.mjs` verbatim, which would
            # reject an area it does not know. A change to the native package
            # cannot break the TypeScript suite — the tests import the
            # TypeScript sources — so it runs the parity job instead.
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: native
              with:
                  filters: |
                      native:
                        - 'packages/jskit-native/**'
                        - '!**/*.md'

            # A separate step so that the web app stays out of `changes`, which
            # is passed to `test-affected.mjs` verbatim and would reject it.
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
              id: apps
              with:
                  filters: |
                      inspect:
                        - 'packages/jskit-inspect/**'

    # ------------------------------------------------------------------------
    # Lint and formatting. Cheap, and unaffected by which analysis changed.
    # ------------------------------------------------------------------------
    verify_files:
        name: Verify Files
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: npm

            # `npm ci` runs the root `prepare`, which builds the toolkit —
            # `eslint.config.js` lints this repository with its own parser and
            # imports it from `dist/`.
            - name: Install Packages
              run: npm ci

            - name: Lint Files
              run: npm run lint:js+ts

            - name: Check Formatting
              run: npm run fmt:check

    lint_types:
        name: Lint Types
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: npm

            - name: Install Packages
              run: npm ci

            - name: Run TypeScript Compiler
              run: npm run lint:types

    # ------------------------------------------------------------------------
    # The affected tests, across the supported Node versions and platforms.
    # ------------------------------------------------------------------------
    test:
        name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
        needs: changes
        if: needs.changes.outputs.areas != ''
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                node-version: [22.x, 24.x, 26.x]
                include:
                    - os: windows-latest
                      node-version: 24.x
                    - os: macos-latest
                      node-version: 24.x

        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install Packages
              run: npm ci

            - name: Run Affected Tests
              run: npm run test:affected -- ${{ needs.changes.outputs.areas }}
              env:
                  CI: true

    # ------------------------------------------------------------------------
    # The same selection, once, with the coverage gate applied to it.
    #
    # Measuring only the areas that ran is what makes a partial run gradeable:
    # each area clears the 95% in `vitest.config.ts` on its own, so narrowing
    # the measurement narrows what is checked without lowering the bar.
    # ------------------------------------------------------------------------
    coverage:
        name: Coverage
        needs: changes
        if: needs.changes.outputs.areas != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: npm

            - name: Install Packages
              run: npm ci

            - name: Run Affected Tests With Coverage
              run: npm run test:affected -- ${{ needs.changes.outputs.areas }} --coverage
              env:
                  CI: true

            - name: Summarize Coverage
              if: always()
              run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

            - name: Upload Coverage Report
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: coverage
                  path: packages/jskit/coverage
                  retention-days: 7

    # ------------------------------------------------------------------------
    # The differential corpus: every file in `node_modules` parsed, scoped,
    # and typed, compared against a reference — the implementation each of
    # those analyses replaces, or, for `types/`, the TypeScript checker's
    # verdict on each claim. `flow/` has no reference implementation, so
    # changes to it alone skip this entirely.
    # ------------------------------------------------------------------------
    conformance:
        name: Conformance
        needs: changes
        if: contains(needs.changes.outputs.areas, 'all') || contains(needs.changes.outputs.areas, 'parse') || contains(needs.changes.outputs.areas, 'scope') || contains(needs.changes.outputs.areas, 'types')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: npm

            - name: Install Packages
              run: npm ci

            # A `parse/` change moves the trees every later analysis reads, so
            # it has to run everything. A `scope/` change cannot move a tree,
            # but the type analysis reads the scope buffer, so it runs the
            # scope and types halves. A `types/` change reaches nothing
            # upstream and runs its own half alone.
            - name: Run Full Conformance Suite
              if: contains(needs.changes.outputs.areas, 'all') || contains(needs.changes.outputs.areas, 'parse')
              run: npm run test:conformance --workspace=@eslint/jskit

            - name: Run Scope Conformance Suite
              if: ${{ !(contains(needs.changes.outputs.areas, 'all') || contains(needs.changes.outputs.areas, 'parse')) && contains(needs.changes.outputs.areas, 'scope') }}
              run: npm run test:conformance:scope --workspace=@eslint/jskit

            - name: Run Types Conformance Suite
              if: ${{ !(contains(needs.changes.outputs.areas, 'all') || contains(needs.changes.outputs.areas, 'parse')) }}
              run: npm run test:conformance:types --workspace=@eslint/jskit

    # ------------------------------------------------------------------------
    # The native implementation must write byte-identical buffers, and the
    # two implementations can only drift when one of them moves: a change to
    # the Rust package, or to any of the three analyses it mirrors. The
    # parity tests compare through the public entry point; the differential
    # runs compare raw buffers over a corpus slice, one per producer. Releases
    # rerun the parity tests on every platform before publishing a binary.
    # ------------------------------------------------------------------------
    native_parity:
        name: Native Parity
        needs: changes
        if: needs.changes.outputs.native == 'true' || needs.changes.outputs.areas != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: npm

            # Pinned by commit SHA, not by tag, for the same reason
            # `dorny/paths-filter` is.
            - name: Install Rust
              uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

            - name: Install Packages
              run: npm ci

            - name: Build the Native Binary
              run: npm run build --workspace=@eslint/jskit-native

            - name: Run Rust Tests
              run: cargo test --release
              working-directory: packages/jskit-native

            - name: Run Parity Tests
              run: npm test --workspace=@eslint/jskit-native

            - name: Run Differential Corpus Slices
              working-directory: packages/jskit-native
              run: |
                  node tools/diff-parse.mjs ../../node_modules 1500 --all-options
                  node tools/diff-validate.mjs ../../node_modules 1500
                  node tools/diff-analyze.mjs ../../node_modules 1500
                  node tools/diff-graph.mjs ../../node_modules 1500
                  node tools/diff-types.mjs ../../node_modules 1500

    # ------------------------------------------------------------------------
    # The web app consumes the toolkit, so it is built whenever either moves.
    # ------------------------------------------------------------------------
    build_inspect:
        name: Build Inspector
        needs: changes
        if: needs.changes.outputs.inspect == 'true' || needs.changes.outputs.areas != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: npm

            - name: Install Packages
              run: npm ci

            - name: Build
              run: npm run build --workspace=@eslint/jskit-inspect

    # ------------------------------------------------------------------------
    # One check to require in branch protection. Without it, every gated job
    # above would have to be listed there, and a job that correctly skipped —
    # flow-only changes skip conformance, prose-only changes skip the tests —
    # would read as a missing required check and block the merge.
    # ------------------------------------------------------------------------
    ci_success:
        name: CI Success
        needs:
            - verify_files
            - lint_types
            - test
            - coverage
            - conformance
            - native_parity
            - build_inspect
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check Results
              run: |
                  results='${{ toJSON(needs) }}'
                  echo "$results"
                  if echo "$results" | grep -q '"result": *"\(failure\|cancelled\)"'; then
                    echo "::error::At least one required job did not succeed."
                    exit 1
                  fi
                  echo "All required jobs succeeded or were skipped."
