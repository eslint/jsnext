name: release-please

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            jskit_released: ${{ steps.release.outputs['packages/jskit--release_created'] }}
            native_released: ${{ steps.release.outputs['packages/jskit-native--release_created'] }}
        permissions:
            # release-please opens and updates the release pull request, and
            # tags the release when that pull request merges.
            contents: write
            pull-requests: write
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  # A personal access token so that the release pull request is
                  # authored by a real account and therefore runs CI. Pushes
                  # made with the built-in `GITHUB_TOKEN` deliberately do not
                  # trigger other workflows, so with the fallback the release
                  # pull request will sit unchecked.
                  token: ${{ secrets.WORKFLOW_PUSH_BOT_TOKEN || github.token }}
                  target-branch: ${{ github.ref_name }}

            - name: Output Release Info
              run: |
                  echo "releases_created: ${{ steps.release.outputs.releases_created }}"
                  echo "packages/jskit--release_created: ${{ steps.release.outputs['packages/jskit--release_created'] }}"
                  echo "packages/jskit-native--release_created: ${{ steps.release.outputs['packages/jskit-native--release_created'] }}"

    # One native binary per platform, each built on a runner of that platform
    # — nothing is cross-compiled — and each verified before it is uploaded:
    # the parity tests in packages/jskit-native/test.mjs assert that the
    # binary produces byte-identical buffers to the TypeScript implementation
    # on that machine. A binary that was never exercised on its own platform
    # does not get published.
    build-native:
        needs: release-please
        if: ${{ needs.release-please.outputs.releases_created == 'true' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64-gnu
                    - os: ubuntu-24.04-arm
                      target: linux-arm64-gnu
                    - os: macos-13
                      target: darwin-x64
                    - os: macos-latest
                      target: darwin-arm64
                    - os: windows-latest
                      target: win32-x64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*

            # Pinned by commit SHA, not by tag, for the same reason
            # `dorny/paths-filter` is in ci.yml: a tag can be moved to point
            # at different code, and this workflow publishes to npm.
            - name: Install Rust
              uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

            # `npm ci` also runs the root `prepare`, which builds the
            # toolkit's dist/ — the parity tests load the package through it.
            - name: Install Packages
              run: npm ci

            - name: Build the Native Binary
              run: npm run build --workspace=@eslint/jskit-native

            - name: Verify Parity Against the TypeScript Implementation
              run: npm test --workspace=@eslint/jskit-native

            # The artifact is named after the target so that the publish
            # job's download step drops each binary back into its platform
            # package directory.
            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.target }}
                  path: packages/jskit-native/npm/${{ matrix.target }}/jskit.${{ matrix.target }}.node
                  if-no-files-found: error

    # The packages ship together: the buffer formats are one contract with
    # two implementations, and `@eslint/jskit` pins the exact
    # `@eslint/jskit-native` version it was released beside, which in turn
    # pins the exact version of each platform package (the linked-versions
    # plugin keeps every version number in the group equal).
    publish:
        needs: [release-please, build-native]
        if: ${{ needs.release-please.outputs.releases_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # npm provenance is signed with a GitHub OIDC token, which is also
            # what npm trusted publishing authenticates with.
            id-token: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  registry-url: "https://registry.npmjs.org"

            # Trusted publishing needs npm 11.5.1 or later, which is newer than
            # what the Node runner ships.
            - name: Update npm
              run: npm install -g npm@latest

            # This also runs the root `prepare`, which builds the toolkit.
            - name: Install Packages
              run: npm ci

            # Each artifact is named after its target, and download-artifact
            # extracts every artifact into a directory of its own name, so
            # each binary lands back inside its platform package —
            # packages/jskit-native/npm/<target>/jskit.<target>.node.
            - uses: actions/download-artifact@v8
              with:
                  path: packages/jskit-native/npm

            - name: List the Binaries Being Published
              run: ls -la packages/jskit-native/npm/*/*.node

            # The checked-in `@eslint/jskit-native` package.json carries no
            # `optionalDependencies`: a pin can only point at a published
            # version, and the release pull request bumps every version
            # before anything is published, so a checked-in pin would break
            # `npm ci` on that very pull request. This stamps the five
            # platform packages in, each pinned to the exact version about
            # to be published — the same move esbuild's publish makes.
            - name: Pin the Platform Packages in @eslint/jskit-native
              if: ${{ needs.release-please.outputs.native_released == 'true' }}
              run: node packages/jskit-native/tools/pin-platform-packages.mjs

            # No `NODE_AUTH_TOKEN`: every package is published through npm
            # trusted publishing, which authenticates with the OIDC token
            # granted by the `id-token: write` permission above and requires
            # no stored secret. Publishing runs bottom-up so every exact pin
            # exists by the time anyone installs it: the platform packages
            # first, then `@eslint/jskit-native` (which pins them), then
            # `@eslint/jskit` (which pins it). One binary per platform
            # package; `os`, `cpu`, and (on Linux) `libc` in each one's
            # package.json make npm install only the match. The platform
            # packages are not npm workspaces — npm refuses to install a
            # workspace whose `os`/`cpu` do not match the machine — so they
            # publish from their own directories rather than by name.
            - name: Publish the Platform Packages
              if: ${{ needs.release-please.outputs.native_released == 'true' }}
              run: |
                  for target in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu win32-x64; do
                      (cd "packages/jskit-native/npm/${target}" && npm publish --provenance)
                  done

            - name: Publish @eslint/jskit-native
              if: ${{ needs.release-please.outputs.native_released == 'true' }}
              run: npm publish --provenance --workspace=@eslint/jskit-native

            - name: Publish @eslint/jskit
              if: ${{ needs.release-please.outputs.jskit_released == 'true' }}
              run: npm publish --provenance --workspace=@eslint/jskit
