[package]
name = "jskit-napi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Node-API bindings for jskit-core."

[lib]
crate-type = ["cdylib"]

[dependencies]
jskit-core = { path = "../jskit-core" }
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
